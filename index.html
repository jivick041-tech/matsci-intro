  const call=(fn)=>{const h={};const o={withSuccessHandler(f){h.s=f;return o},withFailureHandler(f){h.f=f;return o},
    saveProgress(p){fetch(SAVE_URL,{method:"POST",mode:"no-cors",keepalive:true,credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).then(()=>h.s&&h.s(true),()=>h.f&&h.f())},
    loadProgress(sid){const nm="__wl"+Math.random().toString(36).slice(2),sc=document.createElement("script");let done=false;const fin=(ok,t)=>{if(done)return;done=true;try{delete window[nm]}catch(e){}sc.remove();ok?(h.s&&h.s(t)):(h.f&&h.f())};window[nm]=t=>fin(true,t);sc.onerror=()=>fin(false);setTimeout(()=>fin(false),15000);sc.src=SAVE_URL+"?action=load&u="+encodeURIComponent(sid)+"&cb="+nm;document.head.appendChild(sc)}};return o};
  return {withSuccessHandler(f){return call().withSuccessHandler(f)},withFailureHandler(f){return call().withFailureHandler(f)}};
})():null);
const TR={owner:false,dash:false,lastAct:Date.now(),dirty:false,saving:false,saved:0,err:false,loadedFor:"",timer:0};
function openDash(){}
state.prog=state.prog||{sid:"",sname:"",first:Date.now(),last:Date.now(),visits:0,ch:{}};
state.prog.sub=state.prog.sub||{};
state.prog.visits=(state.prog.visits||0)+1;state.prog.last=Date.now();save();
function chp(n){const k=String(n);const c=state.prog.ch[k]=state.prog.ch[k]||{time:0,qs:{},self:{},rating:0,comment:"",first:Date.now(),changed:0};return c}
function trSummary(ch){const c=chp(ch.num),qs=allQs(ch);c.total=qs.length;c.done=qs.filter(([k])=>c.qs[k]).length;c.correct=qs.filter(([k])=>c.qs[k]&&c.qs[k].ok).length}
function trChanged(n){const c=chp(n);c.changed=Date.now();state.prog.last=Date.now();save();TR.dirty=true;clearTimeout(TR.timer);TR.timer=setTimeout(srvSave,3000);updSubmit()}
function trRecord(ch,key,ok){const c=chp(ch.num),r=c.qs[key]||{ok:false,tries:0};const wasOk=!!r.ok,prevTries=r.tries||0;r.tries=prevTries+1;r.ok=!!(r.ok||ok);c.qs[key]=r;trSummary(ch);trChanged(ch.num);
  if(window.GAME&&ok&&!wasOk){const q=(allQs(ch).find(x=>x[0]===key)||[])[1]||{};const zi=/^z(\d+)-/.exec(key);const z=zi?ch.zones[+zi[1]]:null;
    GAME.answer({id:K(ch,key),ok:true,first:prevTries===0,practice:key.startsWith("p_")||key.startsWith("b2_"),wasWrong:prevTries>0,kind:q.t==="open"?"open":"auto",zone:z?{key:"c"+ch.num+"-"+z.code,label:z.code+" "+z.title}:null});
    if(window.GAME)GAME.setWeak(weakZone())}
  else if(window.GAME&&!ok&&!wasOk&&((allQs(ch).find(x=>x[0]===key)||[])[1]||{}).t!=="open")GAME.wrong({id:K(ch,key)})}
function weakZone(){let best=null;const touched=CHAPTERS.filter(c=>Object.keys(chp(c.num).qs||{}).length);(touched.length?touched:[CHAPTERS[cur]||CHAPTERS[0]]).forEach(c=>{const cq=chp(c.num).qs||{};c.zones.forEach((z,zi)=>{const n=z.qs.length;const ok=z.qs.filter((_,qi)=>cq["z"+zi+"-"+qi]&&cq["z"+zi+"-"+qi].ok).length;const f=ok/n;if(ok<n&&(!best||f<best.f))best={f,key:"c"+c.num+"-"+z.code,label:"第 "+c.num+" 章 "+z.code+" "+z.title}})});return best?{key:best.key,label:best.label}:null}
setInterval(()=>{const ch=CHAPTERS[cur];if(ch&&document.visibilityState==="visible"&&Date.now()-TR.lastAct<120000){chp(ch.num).time=(chp(ch.num).time||0)+5;if(window.GAME&&state.prog.sid)GAME.time(5);TR.dirty=true;if(Math.random()<0.25){save();updSubmit()}}},5000);
setInterval(srvSave,60000);
["pointerdown","keydown","scroll","input"].forEach(ev=>addEventListener(ev,()=>{TR.lastAct=Date.now()},{passive:true}));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){save();srvSave()}});

const SELF=[["ok","懂了"],["part","大概懂"],["no","還不懂"]];
function rowVals(ch){
  trSummary(ch);const c=chp(ch.num),p=state.prog;
  const selfTxt=ch.zones.filter(z=>c.self[z.code]).map(z=>z.code+" "+(SELF.find(s=>s[0]===c.self[z.code])||["",""])[1]).join("、")||"（未填）";
  return [p.sid,p.sname,`第 ${ch.num} 章 ${ch.name}`,`${c.done} / ${c.total}`,String(c.correct),String(Math.round((c.time||0)/60)),selfTxt,c.rating?String(c.rating):"（未填）",c.comment||""];
}
function formLink(ch){const vals=rowVals(ch);return FORM_URL+"?usp=pp_url&"+FORM_ENTRY.map((e,i)=>"entry."+e+"="+encodeURIComponent(vals[i])).join("&")}

/* ---- automatic save (Apps Script) ---- */
function srvSave(){
  const p=state.prog;
  if(!SRV||!p.sid||!p.sname||TR.saving||!TR.dirty||TR.loadedFor!==p.sid)return;
  TR.saving=true;TR.dirty=false;
  const rows=CHAPTERS.filter(ch=>{const c=chp(ch.num);trSummary(ch);return c.done||c.time>=30||Object.keys(c.self).length||c.rating||c.comment}).map(ch=>{const v=rowVals(ch);return {ch:ch.num,vals:v}});
  const data=JSON.stringify({prog:p,q:state.q});
  SRV.withSuccessHandler(()=>{TR.saving=false;TR.err=false;TR.saved=Date.now();updSubmit()})
     .withFailureHandler(()=>{TR.saving=false;TR.err=true;TR.dirty=true;updSubmit()})
     .saveProgress({sid:p.sid,sname:p.sname,visits:p.visits||1,rows,data});
  updSubmit();
}
function srvLoad(){
  const p=state.prog;if(!SRV||!p.sid)return;
  const sid=p.sid;
  SRV.withSuccessHandler(json=>{
      if(json){try{mergeRemote(JSON.parse(json))}catch(e){}}
      TR.loadedFor=sid;TR.dirty=true;save();render(cur);srvSave();
    })
    .withFailureHandler(()=>{TR.loadedFor=sid;TR.dirty=true;updSubmit();srvSave()})
    .loadProgress(sid);
}
function mergeRemote(r){
  const rp=r&&r.prog,p=state.prog;if(!rp)return;
  p.first=Math.min(p.first||Date.now(),rp.first||Date.now());p.visits=Math.max(p.visits||0,(rp.visits||0)+1);
  Object.entries(rp.ch||{}).forEach(([n,rc])=>{const c=chp(n);c.time=Math.max(c.time||0,rc.time||0);
    Object.entries(rc.qs||{}).forEach(([k,v])=>{const l=c.qs[k];c.qs[k]=l?{ok:l.ok||v.ok,tries:Math.max(l.tries||0,v.tries||0)}:v});
    c.self={...(rc.self||{}),...(c.self||{})};c.rating=c.rating||rc.rating||0;c.comment=c.comment||rc.comment||"";c.changed=Math.max(c.changed||0,rc.changed||0)});
  Object.entries((r&&r.q)||{}).forEach(([k,v])=>{if(!state.q[k])state.q[k]=v});
}

function pending(ch){const c=chp(ch.num),s=state.prog.sub[ch.num]||0;return (c.changed||0)>s}
function submitHTML(ch,cls){
  if(!state.prog.sid||!state.prog.sname)return `<button class="b ${cls||""}" data-needid="1">填寫學號${SRV?"後自動儲存":"後提交"}</button>`;
  if(SRV)return "";
  return `<a class="b sublink ${cls||""}" data-subch="${ch.num}" href="${esc(formLink(ch))}" target="_blank" rel="noopener">提交第 ${ch.num} 章練習紀錄</a>`;
}
function wireSubmit(root){
  (root||document).querySelectorAll("[data-subch]").forEach(a=>{a.onclick=()=>{state.prog.sub[a.dataset.subch]=Date.now();save();setTimeout(()=>{updSubmit();trBadge()},400)}});
  (root||document).querySelectorAll("[data-needid]").forEach(b=>b.onclick=()=>showLogin());
}
function updSubmit(){
  const bar=$("subbar"),ch=CHAPTERS[cur];if(!bar||!ch)return;
  trSummary(ch);const c=chp(ch.num),p=state.prog;let st;
  if(SRV){
    const hm=t=>new Date(t).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
    if(!p.sid||!p.sname)st=`<span class="pill warn">● 尚未填學號，紀錄不會傳給老師</span>`;
    else if(TR.err)st=`<span class="pill warn">● 暫時無法連線，稍後會自動重試</span>`;
    else if(TR.saving||TR.loadedFor!==p.sid)st=`<span class="pill">● 儲存中…</span>`;
    else if(TR.saved)st=`<span class="pill ok">● 已自動儲存（${hm(TR.saved)}）</span>`;
    else st=`<span class="pill ok">● 會自動儲存給老師</span>`;
  }else{
    const pend=pending(ch),sub=p.sub[ch.num];
    st=pend?`<span class="pill warn">● 有新進度尚未提交</span>`:sub?`<span class="pill ok">● 已提交（${new Date(sub).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}）</span>`:`<span class="pill">● 尚未開始作答</span>`;
  }
  bar.innerHTML=`<div class="subin"><div class="subinfo"><b>第 ${ch.num} 章</b>　已作答 ${c.done}/${c.total}・答對 ${c.correct}・練習 ${Math.round((c.time||0)/60)} 分鐘　${st}</div>${submitHTML(ch,!SRV&&pending(ch)?"":"ghost")}</div>`;
  wireSubmit(bar);
  document.querySelectorAll("a[data-subch]").forEach(a=>{if(a.closest("#subbar"))return;a.href=formLink(CHAPTERS.find(x=>String(x.num)===a.dataset.subch)||ch)});
}
function trBadge(){
  const el=$("syncbox");if(!el)return;const p=state.prog;
  el.innerHTML=`<div class="idrow"><span class="pill">練習者</span><label for="sid">學號</label><input id="sid" value="${esc(p.sid||"")}" autocomplete="off"><label for="sname">姓名</label><input id="sname" value="${esc(p.sname||"")}" autocomplete="off"><button class="b ghost" id="saveid">儲存</button><span class="fmt" id="idmsg"></span></div>
   <div class="fmt">${SRV?"練習時間、作答結果、自評與回饋會自動儲存並傳給老師，不需要另外提交。換一台裝置時，輸入同一個學號就能接續進度。":"練習時間、作答結果、自評與回饋會自動記錄在這台裝置。練習結束時，請按畫面底部的「提交練習紀錄」，在開啟的 Google 表單中直接按「提交」，老師才收得到。可以多次提交，以最新一次為準。"}</div>`;
  $("saveid").onclick=()=>{const old=p.sid;p.sid=$("sid").value.trim().slice(0,30);p.sname=$("sname").value.trim().slice(0,30);save();$("idmsg").textContent=p.sid&&p.sname?"已儲存":"請填寫學號與姓名";if(p.sid&&p.sid!==old)srvLoad();else{TR.dirty=true;srvSave()}updSubmit();refreshInline();if(window.GAME)GAME.refreshUser()};
}
function refreshInline(){document.querySelectorAll(".subslot").forEach(s=>{const ch=CHAPTERS.find(x=>String(x.num)===s.dataset.ch);if(ch){s.innerHTML=submitHTML(ch);wireSubmit(s)}})}
function showLogin(){
  if($("login"))return;const p=state.prog;
  const d=document.createElement("div");d.id="login";d.className="overlay";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");d.setAttribute("aria-labelledby","logintitle");
  d.innerHTML=`<div class="card"><div class="eyebrow">開始練習</div><h3 id="logintitle">請輸入學號與姓名</h3><p class="guide">${SRV?"你的練習紀錄會依學號自動儲存給老師。換裝置時輸入同一個學號，就能接續之前的進度。":"提交練習紀錄給老師時，會自動帶入這些資料。資料只存在你的裝置與老師的表單中。"}</p>
   <div class="rows"><div class="row"><label class="lab" for="lsid">學號</label><input id="lsid" value="${esc(p.sid||"")}" autocomplete="off"></div><div class="row"><label class="lab" for="lsname">姓名</label><input id="lsname" value="${esc(p.sname||"")}" autocomplete="off"></div></div>
   <div class="fmt" id="lmsg"></div><div class="acts"><button class="b" id="lok">開始練習</button><button class="b ghost" id="llater">稍後再填</button></div></div>`;
  document.body.appendChild(d);setTimeout(()=>$("lsid").focus(),50);
  const ok=()=>{const a=$("lsid").value.trim(),b=$("lsname").value.trim();if(!a||!b){$("lmsg").textContent="請填寫學號與姓名。";return}const old=p.sid;p.sid=a.slice(0,30);p.sname=b.slice(0,30);save();d.remove();trBadge();updSubmit();refreshInline();if(SRV&&(p.sid!==old||TR.loadedFor!==p.sid))srvLoad();if(window.GAME)GAME.refreshUser()};
  $("lok").onclick=ok;d.addEventListener("keydown",e=>{if(e.key==="Enter")ok();if(e.key==="Escape")d.remove()});$("llater").onclick=()=>d.remove();
}

function selfHTML(ch,z){const v=chp(ch.num).self[z.code]||"";return `<div class="selfbox" data-zone="${z.code}"><span class="sl">讀完這一區，你覺得自己：</span>${SELF.map(([k,l])=>`<button class="sb sb-${k}" data-self="${k}" aria-pressed="${v===k}">${l}</button>`).join("")}</div>`}
function feedbackHTML(ch){const c=chp(ch.num);return `<section class="step" id="sec-feedback"><div class="stephead"><span class="sn">回饋</span><h3>本章學習回饋${SRV?"":"與提交"}</h3><span class="ref">老師會看到你的回饋</span></div>
  <p class="guide" style="margin-top:12px">整體來說，你對第 ${ch.num} 章的理解程度：</p>
  <div class="rate" role="group" aria-label="理解程度">${[1,2,3,4,5].map(n=>`<button data-rate="${n}" aria-pressed="${c.rating===n}">${n}<small>${["","很不懂","不太懂","普通","大致了解","完全了解"][n]}</small></button>`).join("")}</div>
  <label class="guide" for="fbtext" style="display:block;margin-top:14px">還有哪些地方不清楚，或想請老師上課再講一次？</label>
  <textarea id="fbtext" maxlength="500" placeholder="例如：米勒指數負號的原點移動還不太懂">${esc(c.comment||"")}</textarea>
  ${SRV?`<div class="remind"><b>你的回饋會自動傳給老師。</b>不需要另外按提交，畫面底部會顯示儲存狀態。<div class="acts subslot" data-ch="${ch.num}">${submitHTML(ch)}</div></div>`
       :`<div class="remind"><b>練習結束了嗎？記得提交。</b>按下按鈕會開啟老師的 Google 表單，資料已自動填好，確認後按表單最下方的「提交」即可。<div class="acts subslot" data-ch="${ch.num}">${submitHTML(ch)}</div></div>`}</section>`}
function wireFeedback(ch){
  document.querySelectorAll(".selfbox").forEach(box=>box.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{chp(ch.num).self[box.dataset.zone]=b.dataset.self;if(window.GAME&&state.prog.sid)GAME.self(ch.num+"-"+box.dataset.zone);box.querySelectorAll("[data-self]").forEach(x=>x.setAttribute("aria-pressed",x===b));trChanged(ch.num)}));
  document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{chp(ch.num).rating=+b.dataset.rate;if(window.GAME&&state.prog.sid)GAME.rate(ch.num);document.querySelectorAll("[data-rate]").forEach(x=>x.setAttribute("aria-pressed",x===b));trChanged(ch.num)});
  if($("fbtext"))$("fbtext").addEventListener("input",()=>{chp(ch.num).comment=$("fbtext").value.trim().slice(0,500);trChanged(ch.num)});
  wireSubmit();
  if(!$("subbar")){const b=document.createElement("div");b.id="subbar";b.className="subbar";document.body.appendChild(b)}
  updSubmit();
  if(!state.prog.sid||!state.prog.sname){if(!TR.asked){TR.asked=true;setTimeout(showLogin,300)}}
  else if(SRV&&TR.loadedFor!==state.prog.sid&&!TR.loading){TR.loading=true;srvLoad()}
}

{const m=location.hash.match(/^#ch(\d+)$/);let qch="";try{qch=new URLSearchParams(location.search).get("ch")||""}catch(e){}const want=window.__CH?+window.__CH:(qch?+qch:(m?+m[1]:0));const i=want?CHAPTERS.findIndex(c=>c.num===want):-1;cur=i>=0?i:0;render(cur);}
if(window.GAME){GAME.onLoginRequest=showLogin;GAME.qbank=()=>{const out=[];CHAPTERS.forEach(ch=>{const c=(state.prog.ch||{})[String(ch.num)];const touched=!!(c&&Object.keys(c.qs||{}).length);allQs(ch).forEach(([k,q])=>{if(q.t!=="mc"||!q.o||q.o.length<2)return;let fig="";if(q.sfig&&FIG[q.sfig]){try{fig=FIG[q.sfig]()}catch(e){}}out.push({id:K(ch,k),ch:ch.num,chName:"第 "+ch.num+" 章 "+ch.name,s:q.s,o:q.o,a:q.a,fig,touched})})});return out};GAME.onGuide=z=>{const m=/^c(\d+)-(.+)$/.exec(z.key);if(!m)return;const ci=CHAPTERS.findIndex(c=>String(c.num)===m[1]);if(ci<0)return;const zi=CHAPTERS[ci].zones.findIndex(x=>x.code===m[2]);go(ci);setTimeout(()=>{const el=$("sec-z"+zi);if(el)el.scrollIntoView({behavior:smooth(),block:"start"})},150)};GAME.retroCount=()=>CHAPTERS.reduce((s,c)=>s+Object.values(chp(c.num).qs||{}).filter(r=>r.ok).length,0);GAME.setWeak(weakZone());GAME.init({mount:document.querySelector("header.top")});updScores(CHAPTERS[cur])}
</script>
