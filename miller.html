<style>

.mcq{display:grid;gap:6px;margin-top:8px}

.toolink{display:inline-block;margin-top:8px;font-size:.88rem;color:var(--steel)}

  .stage{grid-template-columns:minmax(0,1fr)}

}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function frac(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}}
function toFrac(x){for(let d=1;d<=24;d++){const n=Math.round(x*d);if(Math.abs(x*d-n)<1e-7)return frac(n,d)}return null}
function fstr(x){const f=typeof x==="number"?toFrac(x):x;if(!f)return(+x).toFixed(3);if(f.d===1)return f.n<0?"−"+(-f.n):String(f.n);return(f.n<0?"−":"")+Math.abs(f.n)+"/"+f.d}
function parseFrac(s){s=String(s).trim().replace(/[−–—]/g,"-").replace(/\s/g,"");
  if(/^[+-]?(∞|inf|infinity|無限|無窮)$/i.test(s))return "inf";
  if(s==="")return undefined;
  let m=s.match(/^([+-]?\d+)\/([+-]?\d+)$/);if(m){return +m[2]?frac(+m[1],+m[2]):undefined}
  if(/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)){const f=toFrac(parseFloat(s));return f||undefined}
  return undefined}
const ib=n=>n<0?`<span class="ob">${-n}</span>`:String(n);
const idx=(a,br)=>br[0]+a.map(ib).join(a.some(v=>Math.abs(v)>9)?"&thinsp;":"")+br[1];
function reduce(a){const g=a.reduce((s,v)=>gcd(s,v),0)||1;return a.map(v=>v/g+0)}
const aFrac=(m,unit="a")=>{if(m===1)return unit;if(m===-1)return"−"+unit;return(m<0?"−":"")+unit+"/"+Math.abs(m)};
const coordStr=p=>"("+p.map(v=>fstr(v)).join(", ")+")";
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= state ================= */
const S={tab:"plane",
  plane:{h:1,k:1,l:1,mode:"idx",ints:["1","1","1"],showInt:true,showNormal:false,ext:false,family:false,eq:false,atoms:"none"},
  dir:{u:1,v:1,w:0,mode:"idx",tail:["0","0","0"],head:["1","1/2","0"],showPath:true,ext:false,eq:false,showPlane:false,atoms:"none",corner:false},
  hex:{kind:"plane",h:1,k:0,l:0,din:"3",U:1,V:0,W:0,u4:2,v4:-1,w4:0,showInt:true,path3:true,path4:true,eq:false,atoms:false},
  quiz:{plane:null,dir:null,hex:null},
  ans:{h:0,k:0,l:0}};
let score={ok:0,n:0};try{score=JSON.parse(localStorage.getItem("miller-score"))||score}catch(e){}
const saveScore=()=>{try{localStorage.setItem("miller-score",JSON.stringify(score))}catch(e){}};
const getP=k=>k.split(".").reduce((o,x)=>o[x],S);
const setP=(k,v)=>{const p=k.split(".");const last=p.pop();p.reduce((o,x)=>o[x],S)[last]=v};

/* ================= 3D ================= */
const HAS3D=typeof THREE!=="undefined";
let renderer,scene,camera,dyn;let labels=[],lbEls=[];
const view={theta:.49,phi:1.23,r:4.4,target:null,W:1,H:1};
let autoRot=false,rafAuto=0;
const V=(x,y,z)=>new THREE.Vector3(y,z,x); /* crystal (x toward viewer, y right, z up) → three.js */
const CH=1.633;
let A1,A2,A3,CC;
const HX=(x,y,z)=>A1.clone().multiplyScalar(x).add(A2.clone().multiplyScalar(y)).add(CC.clone().multiplyScalar(z));
const HEXV=[[1,0],[1,1],[0,1],[-1,0],[-1,-1],[0,-1]];
let COL={};
function readColors(){COL={ink:css("--ink"),muted:css("--muted"),line:css("--line"),accent:css("--accent"),steel:css("--steel"),ok:css("--ok"),paper:css("--paper"),soft:css("--steel-soft")}}

function init3D(){
  if(!HAS3D){$("viewer").insertAdjacentHTML("beforeend",'<div class="nogl">3D 繪圖程式沒有載入成功。請確認網路連線後重新整理頁面。</div>');return}
  const cv=$("cv");
  try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){$("viewer").insertAdjacentHTML("beforeend",'<div class="nogl">這台裝置的瀏覽器不支援 3D 繪圖（WebGL）。請換一個瀏覽器或裝置試試。</div>');return}
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(32,1,.05,100);
  scene.add(new THREE.AmbientLight(0xffffff,.78));const dl=new THREE.DirectionalLight(0xffffff,.5);dl.position.set(3,6,5);scene.add(dl);
  dyn=new THREE.Group();scene.add(dyn);
  A1=new THREE.Vector3(-.5,0,Math.sqrt(3)/2);A2=new THREE.Vector3(1,0,0);A3=new THREE.Vector3(-.5,0,-Math.sqrt(3)/2);CC=new THREE.Vector3(0,CH,0);
  view.target=V(.5,.5,.5);
  const ro=new ResizeObserver(resize);ro.observe($("viewer"));resize();
  /* pointer controls */
  const ptrs=new Map();let pinch=null;
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});stopAuto()});
  cv.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
    if(ptrs.size===1){view.theta-=(e.clientX-p.x)*.009;view.phi=clamp(view.phi-(e.clientY-p.y)*.009,.03,Math.PI-.03)}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)view.r=clamp(view.r*pinch/d,1.6,16);pinch=d}
    render()});
  const end=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  cv.addEventListener("wheel",e=>{e.preventDefault();view.r=clamp(view.r*Math.exp(e.deltaY*.0012),1.6,16);render()},{passive:false});
}
function resize(){if(!renderer)return;const v=$("viewer");view.W=v.clientWidth;view.H=v.clientHeight;renderer.setSize(view.W,view.H,false);camera.aspect=view.W/Math.max(1,view.H);camera.updateProjectionMatrix();render()}
function render(){if(!renderer)return;const t=view.target;
  camera.position.set(t.x+view.r*Math.sin(view.phi)*Math.sin(view.theta),t.y+view.r*Math.cos(view.phi),t.z+view.r*Math.sin(view.phi)*Math.cos(view.theta));
  camera.lookAt(t);renderer.render(scene,camera);placeLabels()}
function placeLabels(){labels.forEach((l,i)=>{const el=lbEls[i];if(!el)return;const v=l.p.clone().project(camera);if(v.z>1){el.style.display="none";return}el.style.display="";
  const x=(v.x+1)/2*view.W+(l.dx||0),y=(1-v.y)/2*view.H+(l.dy||0);el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%)`})}
function flushLabels(){$("labels").innerHTML=labels.map((l,i)=>`<div class="lb ${l.cls||""}">${l.html}</div>`).join("");lbEls=[...$("labels").children]}
function lab(p,html,cls="",dx=0,dy=0){labels.push({p,html,cls,dx,dy})}
function startAuto(){autoRot=true;const step=()=>{if(!autoRot)return;view.theta+=.006;render();rafAuto=requestAnimationFrame(step)};rafAuto=requestAnimationFrame(step);syncVtools()}
function stopAuto(){if(!autoRot)return;autoRot=false;cancelAnimationFrame(rafAuto);syncVtools()}
function tweenTo(th,ph,r){stopAuto();if(reduceMotion){view.theta=th;view.phi=ph;if(r)view.r=r;render();return}
  const s={th:view.theta,ph:view.phi,r:view.r},t0=performance.now();
  let d=((th-s.th)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI;
  const step=t=>{const k=Math.min(1,(t-t0)/480),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;view.theta=s.th+d*e;view.phi=s.ph+(ph-s.ph)*e;view.r=s.r+((r||s.r)-s.r)*e;render();if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function lookAlong(v3,r){const d=v3.clone().normalize();tweenTo(Math.atan2(d.x,d.z),clamp(Math.acos(clamp(d.y,-1,1)),.03,Math.PI-.03),r)}

/* primitives */
function clear(){dyn.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()});dyn.clear();labels=[]}
function seg(a,b,color,o={}){const g=new THREE.BufferGeometry().setFromPoints([a,b]);const op=o.op??1;
  const m=o.dash?new THREE.LineDashedMaterial({color,dashSize:o.ds||.05,gapSize:o.gs||.035,transparent:op<1,opacity:op}):new THREE.LineBasicMaterial({color,transparent:op<1,opacity:op});
  const l=new THREE.Line(g,m);if(o.dash)l.computeLineDistances();dyn.add(l);return l}
function rod(a,b,color,r=.012,op=1){const d=b.clone().sub(a),len=d.length();if(len<1e-6)return;const me=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),new THREE.MeshLambertMaterial({color,transparent:op<1,opacity:op}));
  me.position.copy(a).addScaledVector(d,.5);me.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());dyn.add(me)}
function arrow(a,b,color,r=.016,op=1){const d=b.clone().sub(a),len=d.length();if(len<1e-6)return;const u=d.clone().normalize();const hl=Math.min(.13,len*.4);const e=b.clone().addScaledVector(u,-hl);
  rod(a,e,color,r,op);const me=new THREE.Mesh(new THREE.ConeGeometry(r*3,hl,16),new THREE.MeshLambertMaterial({color,transparent:op<1,opacity:op}));me.position.copy(e).addScaledVector(u,hl/2);me.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),u);dyn.add(me)}
function ball(p,r,color,op=1){const me=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),new THREE.MeshLambertMaterial({color,transparent:op<1,opacity:op}));me.position.copy(p);dyn.add(me)}
function poly(pts,color,op=.55,outline=null){if(pts.length<3)return null;
  const c=pts.reduce((s,p)=>s.add(p),new THREE.Vector3()).multiplyScalar(1/pts.length);let n=null;
  for(let i=0;i<pts.length&&!n;i++)for(let j=i+1;j<pts.length&&!n;j++){const x=pts[i].clone().sub(c).cross(pts[j].clone().sub(c));if(x.length()>1e-7)n=x.normalize()}
  if(!n)return null;const p0=pts.find(p=>p.distanceTo(c)>1e-7);const u=p0.clone().sub(c).normalize(),w=n.clone().cross(u);
  const s=pts.map(p=>({p,a:Math.atan2(p.clone().sub(c).dot(w),p.clone().sub(c).dot(u))})).sort((a,b)=>a.a-b.a).map(o=>o.p);
  const pos=[];for(let i=0;i<s.length;i++){const a=s[i],b=s[(i+1)%s.length];pos.push(c.x,c.y,c.z,a.x,a.y,a.z,b.x,b.y,b.z)}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  dyn.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,side:THREE.DoubleSide,depthWrite:false})));
  if(outline)dyn.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([...s,s[0]]),new THREE.LineBasicMaterial({color:outline})));
  return{c,n}}
function clip(edges,f){const pts=[];edges.forEach(([a,b])=>{const fa=f(a),fb=f(b);if(Math.abs(fa)<1e-9)pts.push(a);if(Math.abs(fb)<1e-9)pts.push(b);
  if(fa*fb<0&&Math.abs(fa)>1e-9&&Math.abs(fb)>1e-9){const t=fa/(fa-fb);pts.push(a.map((v,i)=>v+(b[i]-v)*t))}});
  const u=[];pts.forEach(q=>{if(!u.some(w=>w.every((v,i)=>Math.abs(v-q[i])<1e-7)))u.push(q)});return u}
function boxEdges(lo,hi){const e=[];const L=[[lo[0],hi[0]],[lo[1],hi[1]],[lo[2],hi[2]]];
  for(const y of L[1])for(const z of L[2])e.push([[lo[0],y,z],[hi[0],y,z]]);
  for(const x of L[0])for(const z of L[2])e.push([[x,lo[1],z],[x,hi[1],z]]);
  for(const x of L[0])for(const y of L[1])e.push([[x,y,lo[2]],[x,y,hi[2]]]);return e}
const CORN=[];for(const x of[0,1])for(const y of[0,1])for(const z of[0,1])CORN.push([x,y,z]);
const FACEC=[[.5,.5,0],[.5,.5,1],[.5,0,.5],[.5,1,.5],[0,.5,.5],[1,.5,.5]];
function atomsC(type,n){const m=new Map(),add=(x,y,z)=>{const k=[x,y,z].map(v=>Math.round(v*1e3)).join();if(!m.has(k))m.set(k,[x,y,z])};
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)for(let k=0;k<n;k++){CORN.forEach(c=>add(i+c[0],j+c[1],k+c[2]));if(type==="bcc")add(i+.5,j+.5,k+.5);if(type==="fcc")FACEC.forEach(f=>add(i+f[0],j+f[1],k+f[2]))}
  return[...m.values()]}
function drawCells(n,quiz){for(let i=0;i<n;i++)for(let j=0;j<n;j++)for(let k=0;k<n;k++){const main=!i&&!j&&!k;
  boxEdges([i,j,k],[i+1,j+1,k+1]).forEach(([a,b])=>seg(V(...a),V(...b),main?COL.ink:COL.muted,{op:main?1:.45}))}
  if(quiz){boxEdges([0,0,0],[1,1,1]).forEach(([a,b])=>{const m=a.map((v,i)=>(v+b[i])/2);ball(V(...m),.014,COL.muted)})}}
function drawAxes(len){const O=V(0,0,0);[["x",V(len,0,0)],["y",V(0,len,0)],["z",V(0,0,len)]].forEach(([n,e])=>{arrow(O,e,COL.muted,.006);lab(e,n,"mu big",0,0)});lab(O,"O","mu",-10,10)}
function famC(h,k,l,dedupe){const a=[Math.abs(h),Math.abs(k),Math.abs(l)],P=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]],m=new Map();
  P.forEach(p=>{for(const sx of[1,-1])for(const sy of[1,-1])for(const sz of[1,-1]){let v=[a[p[0]]*sx+0,a[p[1]]*sy+0,a[p[2]]*sz+0];if(dedupe){const f=v.find(x=>x!==0);if(f<0)v=v.map(x=>-x+0)}m.set(v.join(),v)}});return[...m.values()]}

/* ================= PLANE (cubic) ================= */
function planeHKL(){const P=S.plane;if(P.mode==="quiz"&&S.quiz.plane)return S.quiz.plane;
  if(P.mode==="int"){const r=intsToHKL(P.ints);return r.ok?r.raw:null}return[P.h,P.k,P.l]}
function intsToHKL(ints){const fr=ints.map(parseFrac);if(fr.some(f=>f===undefined))return{ok:false,msg:"有一格看不懂。請輸入像 1、1/2、-1 或 ∞ 的值。"};
  if(fr.some(f=>f!=="inf"&&f.n===0))return{ok:false,msg:"截距不能是 0。晶面通過原點時，請先把原點移到別的角落。"};
  if(fr.every(f=>f==="inf"))return{ok:false,msg:"三個截距都是 ∞ 的話不是一個晶面。"};
  const rec=fr.map(f=>f==="inf"?frac(0,1):frac(f.d,f.n));const L=rec.reduce((s,f)=>lcm(s,f.d),1);
  const raw=rec.map(f=>f.n*L/f.d);const hkl=reduce(raw);return{ok:true,fr,rec,L,raw,hkl}}
function buildPlane(){const P=S.plane,quiz=P.mode==="quiz";const hkl=planeHKL();const n=P.ext&&!quiz?2:1;
  drawCells(n,quiz);drawAxes(n===2?2.35:1.4);
  if(!hkl||hkl.every(v=>v===0))return;const[h,k,l]=hkl;
  const o=[h<0?1:0,k<0?1:0,l<0?1:0];const f=(q,c=1)=>h*(q[0]-o[0])+k*(q[1]-o[1])+l*(q[2]-o[2])-c;
  const cell=boxEdges([0,0,0],[1,1,1]),box=boxEdges([0,0,0],[n,n,n]);
  if(P.eq&&!quiz){famC(h,k,l,true).forEach(v=>{const r=reduce(v),me=reduce(hkl);if(r.join()===me.join()||r.map(x=>-x+0).join()===me.join())return;
    const oo=v.map(x=>x<0?1:0);const pts=clip(cell,q=>v[0]*(q[0]-oo[0])+v[1]*(q[1]-oo[1])+v[2]*(q[2]-oo[2])-1);poly(pts.map(p=>V(...p)),COL.steel,.16,COL.steel)})}
  if(P.family&&!quiz){let lo=1e9,hi=-1e9;CORN.forEach(c=>{const v=f(c.map(x=>x*n),0);lo=Math.min(lo,v);hi=Math.max(hi,v)});
    for(let c=Math.ceil(lo);c<=Math.floor(hi);c++){if(c===1)continue;poly(clip(box,q=>f(q,c)).map(p=>V(...p)),COL.accent,.12,COL.accent)}
    const N=h*h+k*k+l*l,p0=o.map((v,i)=>v+0*hkl[i]),p1=o.map((v,i)=>v+hkl[i]/N);
    arrow(V(...p0),V(...p1),COL.ok,.01);lab(V(...p1.map((v,i)=>(v+p0[i])/2)),"d","ok big",14,-6)}
  if(P.ext&&!quiz)poly(clip(box,q=>f(q,1)).map(p=>V(...p)),COL.accent,.2);
  const res=poly(clip(cell,q=>f(q,1)).map(p=>V(...p)),COL.accent,.58,COL.accent);
  if(P.atoms!=="none"){atomsC(P.atoms,n).forEach(a=>{const on=Math.abs(f(a,1))<1e-6;ball(V(...a),on?.07:.05,on?COL.accent:COL.steel,on?1:.55)})}
  if(o.some(v=>v)){ball(V(...o),.035,COL.steel);if(!quiz)lab(V(...o),"O′ 新原點","st",0,-18)}
  if(P.showInt&&!quiz)[[h,0],[k,1],[l,2]].forEach(([m,ax])=>{if(!m)return;const q=o.slice();q[ax]+=1/m;seg(V(...o),V(...q),COL.accent,{dash:true});ball(V(...q),.028,COL.accent);
    lab(V(...q),"xyz"[ax]+"："+aFrac(m),"ac",0,-15)});
  if(P.showNormal&&res&&!quiz){const nn=V(h,k,l).normalize();arrow(res.c,res.c.clone().addScaledVector(nn,.6),COL.steel,.012);lab(res.c.clone().addScaledVector(nn,.7),idx(hkl,"[]"),"st big")}
  if(res&&!quiz)lab(res.c,idx(hkl,"()"),"ac big",0,0)}
function planeView(kind){const hkl=planeHKL();if(!hkl)return;const n=V(...hkl).normalize();
  if(kind==="face")lookAlong(n);else{let s=n.clone().cross(new THREE.Vector3(0,1,0));if(s.length()<.1)s=n.clone().cross(new THREE.Vector3(1,0,0));lookAlong(s.add(new THREE.Vector3(0,.15,0)))}}

/* ================= DIRECTION (cubic) ================= */
function dirData(){const D=S.dir;
  if(D.mode==="quiz"&&S.quiz.dir){const u=S.quiz.dir;const m=Math.max(...u.map(Math.abs));const t=u.map(x=>x<0?1:0);return{ok:true,uvw:u,tail:t,head:t.map((v,i)=>v+u[i]/m)}}
  if(D.mode==="pts"){const t=D.tail.map(parseFrac),h=D.head.map(parseFrac);if([...t,...h].some(x=>x===undefined||x==="inf"))return{ok:false,msg:"有一格看不懂。請輸入像 0、1、1/2 的座標。"};
    const tv=t.map(f=>f.n/f.d),hv=h.map(f=>f.n/f.d);const d=hv.map((v,i)=>v-tv[i]);if(d.every(v=>Math.abs(v)<1e-9))return{ok:false,msg:"頭和尾是同一點，畫不出向量。"};
    const df=d.map(v=>toFrac(v));const L=df.reduce((s,f)=>lcm(s,f.d),1);const raw=df.map(f=>f.n*L/f.d);return{ok:true,uvw:reduce(raw),tail:tv,head:hv,diff:df,L,raw}}
  const u=[D.u,D.v,D.w];if(u.every(v=>v===0))return{ok:false,msg:"三個指數不能都是 0。"};const m=Math.max(...u.map(Math.abs));const t=u.map(x=>x<0?1:0);return{ok:true,uvw:u,tail:t,head:t.map((v,i)=>v+u[i]/m),m}}
function buildDir(){const D=S.dir,quiz=D.mode==="quiz";const n=D.ext&&!quiz?2:1;drawCells(n,quiz);drawAxes(n===2?2.35:1.4);
  if(D.corner||quiz){CORN.forEach(c=>{if(c.every(v=>v===0))return;lab(V(...c),c.join(""),"mu",12,-9)})}
  const r=dirData();if(!r.ok)return;const{uvw,tail,head}=r;const d=head.map((v,i)=>v-tail[i]);
  if(D.showPlane&&!quiz){const[h,k,l]=uvw,o=[h<0?1:0,k<0?1:0,l<0?1:0];poly(clip(boxEdges([0,0,0],[1,1,1]),q=>h*(q[0]-o[0])+k*(q[1]-o[1])+l*(q[2]-o[2])-1).map(p=>V(...p)),COL.steel,.25,COL.steel)}
  if(D.eq&&!quiz){const c=[.5,.5,.5];famC(...uvw,false).forEach(v=>{const m=Math.max(...v.map(Math.abs));arrow(V(...c),V(...c.map((x,i)=>x+v[i]*.45/m)),COL.steel,.007,.75)})}
  if(D.ext&&!quiz){let t0=-1e9,t1=1e9;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-9){if(tail[i]<-1e-9||tail[i]>n+1e-9){t0=1;t1=0}continue}const a=(0-tail[i])/d[i],b=(n-tail[i])/d[i];t0=Math.max(t0,Math.min(a,b));t1=Math.min(t1,Math.max(a,b))}
    if(t1>t0)seg(V(...tail.map((v,i)=>v+d[i]*t0)),V(...tail.map((v,i)=>v+d[i]*t1)),COL.accent,{dash:true})}
  if(D.atoms!=="none"){const dv=new THREE.Vector3(...d);atomsC(D.atoms,n).forEach(a=>{const on=new THREE.Vector3(...a.map((v,i)=>v-tail[i])).cross(dv).length()<1e-6;ball(V(...a),on?.07:.05,on?COL.accent:COL.steel,on?1:.55)})}
  if(D.showPath&&!quiz){let p=tail.slice();[0,1,2].forEach(ax=>{if(Math.abs(d[ax])<1e-9)return;const q=p.slice();q[ax]+=d[ax];seg(V(...p),V(...q),COL.steel,{dash:true,ds:.04,gs:.03});
    lab(V(...p.map((v,i)=>(v+q[i])/2)),"xyz"[ax]+" "+(d[ax]>0?"+":"")+fstr(d[ax]),"st",0,-12);p=q})}
  arrow(V(...tail),V(...head),COL.accent,.02);ball(V(...tail),.03,COL.accent);
  if(!quiz){lab(V(...tail),"尾 "+coordStr(tail),"mu",0,16);lab(V(...head),"頭 "+coordStr(head),"mu",0,16);lab(V(...head),idx(uvw,"[]"),"ac big",0,-16)}}

/* ================= HEX (Miller–Bravais) ================= */
function hexEdges(){const e=[];for(let i=0;i<6;i++){const a=HEXV[i],b=HEXV[(i+1)%6];e.push([[a[0],a[1],0],[b[0],b[1],0]],[[a[0],a[1],1],[b[0],b[1],1]],[[a[0],a[1],0],[a[0],a[1],1]])}return e}
function hexPlane(){const X=S.hex;if(X.kind==="quiz"&&S.quiz.hex)return S.quiz.hex;return[X.h,X.k,X.l]}
function hexDir(){const X=S.hex;if(X.din==="4"){const u=X.u4,v=X.v4,t=-(u+v),w=X.w4;return{U:u-t,V:v-t,W:w,four:[u,v,t,w]}}
  return{U:X.U,V:X.V,W:X.W,four:reduce([2*X.U-X.V,2*X.V-X.U,-(X.U+X.V),3*X.W])}}
function famH(h,k,l){const i=-(h+k),a=[h,k,i],P=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]],m=new Map();
  P.forEach(p=>{for(const sl of[1,-1]){let v=[a[p[0]],a[p[1]],a[p[2]],l*sl].map(x=>x+0);const f=v.find(x=>x!==0);if(f<0)v=v.map(x=>-x+0);m.set(v.join(),v)}});return[...m.values()]}
function buildHex(){const X=S.hex,quiz=X.kind==="quiz";
  hexEdges().forEach(([a,b])=>seg(HX(...a),HX(...b),COL.ink));
  const O=HX(0,0,0);[["a₁",HX(1.55,0,0)],["a₂",HX(0,1.55,0)],["a₃",HX(-1.55,-1.55,0)],["c",HX(0,0,1.35)]].forEach(([n,e])=>{arrow(O,e,COL.muted,.006);lab(e,n,"mu big")});
  lab(O,"O","mu",-10,12);
  if(X.kind==="dir"){const d=hexDir();if(!d.U&&!d.V&&!d.W)return;const m=Math.max(Math.abs(d.U),Math.abs(d.V),Math.abs(d.W));const hd=[d.U/m,d.V/m,d.W/m];
    if(X.path3){let p=[0,0,0];[[0,d.U/m,"U"],[1,d.V/m,"V"],[2,d.W/m,"W"]].forEach(([ax,v,nm])=>{if(Math.abs(v)<1e-9)return;const q=p.slice();q[ax]+=v;seg(HX(...p),HX(...q),COL.steel,{dash:true});lab(HX(...p.map((x,i)=>(x+q[i])/2)),["a₁","a₂","c"][ax]+" "+fstr(v),"st",0,-12);p=q})}
    if(X.path4){const u=(2*d.U-d.V)/3/m,v=(2*d.V-d.U)/3/m,t=-(d.U+d.V)/3/m,w=d.W/m;let p=new THREE.Vector3();
      [[A1,u,"a₁"],[A2,v,"a₂"],[A3,t,"a₃"],[CC,w,"c"]].forEach(([vec,s,nm])=>{if(Math.abs(s)<1e-9)return;const q=p.clone().addScaledVector(vec,s);seg(p,q,COL.ok,{dash:true,ds:.035,gs:.03});lab(p.clone().add(q).multiplyScalar(.5),nm+" "+fstr(s),"ok",0,12);p=q})}
    arrow(O,HX(...hd),COL.accent,.02);lab(HX(...hd),idx(d.four,"[]"),"ac big",0,-16);return}
  const hkl=hexPlane();const[h,k,l]=hkl;const i=-(h+k);if(!h&&!k&&!l)return;
  const f=(q,c=1)=>h*q[0]+k*q[1]+l*q[2]-c;
  if(X.eq&&!quiz){famH(h,k,l).forEach(v=>{const me=[h,k,i,l];if(v.join()===me.join()||v.map(x=>-x+0).join()===me.join())return;poly(clip(hexEdges(),q=>v[0]*q[0]+v[1]*q[1]+v[3]*q[2]-1).map(p=>HX(...p)),COL.steel,.15,COL.steel)})}
  const res=poly(clip(hexEdges(),q=>f(q)).map(p=>HX(...p)),COL.accent,.58,COL.accent);
  if(X.atoms){const at=[];HEXV.forEach(([a,b])=>{at.push([a,b,0],[a,b,1])});at.push([0,0,0],[0,0,1],[2/3,1/3,.5],[-1/3,1/3,.5],[-1/3,-2/3,.5]);
    at.forEach(a=>{const on=Math.abs(f(a))<1e-6;ball(HX(...a),on?.08:.06,on?COL.accent:COL.steel,on?1:.55)})}
  if(X.showInt&&!quiz){[[h,[1,0,0],"a₁"],[k,[0,1,0],"a₂"],[i,[-1,-1,0],"a₃"],[l,[0,0,1],"c"]].forEach(([m,dir,nm])=>{if(!m)return;const s=1/m;if(Math.abs(s)>1.6)return;const q=dir.map(v=>v*s);
    seg(O,HX(...q),COL.accent,{dash:true});ball(HX(...q),.03,COL.accent);lab(HX(...q),nm+"："+aFrac(m,nm==="c"?"c":"a"),"ac",0,-15)})}
  if(res&&!quiz)lab(res.c,idx([h,k,i,l],"()"),"ac big")}

/* ================= views ================= */
function defaultView(){if(S.tab==="practice"){const v=PR.q&&PR.q.view;if(v==="hexdir"){view.target=new THREE.Vector3(0,CH*.3,0);return[.3,.62,5.4]}if(v==="hex"){view.target=new THREE.Vector3(0,CH/2,0);return[.35,1.17,6.4]}view.target=V(.5,.5,.5);return[.49,1.23,4.4]}
  if(S.tab==="hex"){if(S.hex.kind==="dir"){view.target=new THREE.Vector3(0,CH*.3,0);return[.3,.62,5.4]}view.target=new THREE.Vector3(0,CH/2,0);return[.35,1.17,6.4]}
  const n=(S.tab==="plane"?S.plane.ext:S.dir.ext)&&S[S.tab].mode!=="quiz"?2:1;view.target=V(n/2,n/2,n/2);return[.49,1.23,n===2?7:4.4]}
function resetView(anim){const[t,p,r]=defaultView();if(anim)tweenTo(t,p,r);else{view.theta=t;view.phi=p;view.r=r;render()}}
function syncVtools(){const vt=$("vtools");if(!vt)return;const btn=(id,txt,pr)=>`<button class="vbtn" data-v="${id}"${pr!=null?` aria-pressed="${pr}"`:""}>${txt}</button>`;
  let h=btn("reset","重設視角");
  if(S.tab==="plane")h+=btn("face","正視晶面")+btn("side","側視晶面");

  const T={sc100:[1,[["4 個角落","1/4","1"]]],sc110:[1,[["4 個角落","1/4","1"]]],sc111:[.5,[["3 個角落","1/6","1/2"]]],
   bcc100:[1,[["4 個角落","1/4","1"]]],bcc110:[2,[["4 個角落","1/4","1"],["體心（在面的正中央）","1","1"]]],bcc111:[.5,[["3 個角落","1/6","1/2"]]],
   fcc100:[2,[["4 個角落","1/4","1"],["面心（在正中央）","1","1"]]],fcc110:[2,[["4 個角落","1/4","1"],["2 個面心（在長邊中點）","1/2","1"]]],fcc111:[2,[["3 個角落","1/6","1/2"],["3 個面心（在三邊中點）","1/2","3/2"]]]}[key];
  const SH={100:["正方形，a × a","a²","4 個角都是 90°，每個角落原子只有 1/4 落在這塊面上"],110:["長方形，a × √2 a","√2 a²","4 個角都是 90°，角落原子各佔 1/4"],111:["正三角形，邊長 √2 a","√3/2 a²","三角形的角是 60°，角落原子各佔 60°/360° = 1/6"]}[pl.join("")];
  return{cat:"atom",title:"晶面上的原子數",view:"cubic",
  prompt:`${STR[st]} 晶胞中，${idx(pl,"()")} 晶面切過晶胞的那一塊（圖中橘色區域）上，總共有幾個原子？可以用分數，例如 1/2。`,
  input:{kind:"num",unit:"個",ph:"例如 3/2"},check:x=>({ok:Math.abs(x-T[0])<1e-6}),
  hint:"圖中亮起來的原子都在面上。角落的原子只有一部分在這塊面內；落在邊上的算 1/2；在面中間的算 1 個。",
  sol:()=>`<ol><li><b>這塊面的形狀：</b>${SH[0]}。${SH[2]}。</li>${T[1].map(r=>`<li><b>${r[0]}：</b>每個 ${r[1]} → 共 ${r[2]}</li>`).join("")}
   <li><b>合計：</b>${fstr(T[0])} 個原子</li><li><b>面密度：</b>PD = ${fstr(T[0])} / (${SH[1]})${st==="fcc"&&pl.join("")==="111"?"　（FCC 的 (111) 是最密堆積面）":""}${st==="bcc"&&pl.join("")==="110"?"　（BCC 原子排最密的是 (110)）":""}</li></ol>`,
  scene:()=>withS("plane",Object.assign({},PLANE0,{h:pl[0],k:pl[1],l:pl[2],atoms:st}),undefined,buildPlane),
  go:()=>{Object.assign(S.plane,{mode:"idx",h:pl[0],k:pl[1],l:pl[2],atoms:st});setTab("plane")}}},

 atomLine(){const st=pick(["sc","bcc","fcc"]),d=pick([[1,0,0],[1,1,0],[1,1,1]]);const dk=d.join("");
  const mid={sc:{100:0,110:0,111:0},bcc:{100:0,110:0,111:1},fcc:{100:0,110:1,111:0}}[st][dk];const n=1+mid;const Lg={100:"a",110:"√2 a",111:"√3 a"}[dk];
  const midTxt={bcc:"體心原子",fcc:"面心原子"}[st];
  return{cat:"atom",title:"晶向上的原子數",view:"cubic",
  prompt:`${STR[st]} 晶胞中，沿 ${idx(d,"[]")} 從一個角落走到對面角落（圖中箭頭，長度 ${Lg}）。這段線上總共有幾個原子？可以用分數。`,
  input:{kind:"num",unit:"個",ph:"例如 2"},check:x=>({ok:Math.abs(x-n)<1e-6}),
  hint:"兩端的原子和下一段線共用，各算 1/2；中間完整落在線上的算 1 個。",
  sol:()=>`<ol><li><b>兩端角落：</b>2 × 1/2 = 1</li><li><b>中間：</b>${mid?`${midTxt}剛好在線段中點 → 1`:"線上沒有其他原子 → 0"}</li><li><b>合計：</b>${n} 個原子</li>
   <li><b>線密度：</b>LD = ${n} / (${Lg})${(st==="fcc"&&dk==="110")||(st==="bcc"&&dk==="111")?"　（這是此結構原子排最密的方向）":""}</li></ol>`,
  scene:()=>withS("dir",Object.assign({},DIR0,{u:d[0],v:d[1],w:d[2],atoms:st}),undefined,()=>{buildDir();labels=labels.filter(l=>!/^[頭尾]/.test(l.html))}),
  go:()=>{Object.assign(S.dir,{mode:"idx",u:d[0],v:d[1],w:d[2],atoms:st,ext:true});setTab("dir")}}}
};
const PCATS=[["plane","晶面",["planePic","planeInt","planeD","planeFam"]],["dir","晶向",["dirPic","dirPts","dirAngle","dirRel"]],["hex","六方",["hexPic","hex34","hex43","hexI"]],["atom","原子密度",["atomPlane","atomLine"]]];
const ROUND=10;
const PR={cats:{plane:true,dir:true,hex:true,atom:true},seq:[],i:0,q:null,ans:null,tries:0,counted:false,rev:false,fb:"",log:[]};
let PST={};try{PST=JSON.parse(localStorage.getItem("miller-practice"))||{}}catch(e){}
const savePST=()=>{try{localStorage.setItem("miller-practice",JSON.stringify(PST))}catch(e){}};
function newRound(){const types=PCATS.filter(c=>PR.cats[c[0]]).flatMap(c=>c[2]);let seq=[];while(seq.length<ROUND)seq=seq.concat(shuffle(types));
  for(let i=1;i<seq.length;i++)if(seq[i]===seq[i-1]){const j=seq.findIndex((t,k)=>k>i&&t!==seq[i]);if(j>0)[seq[i],seq[j]]=[seq[j],seq[i]]}
  PR.seq=seq.slice(0,ROUND);PR.i=0;PR.log=[];loadQ()}
function loadQ(){const t=PR.seq[PR.i];if(!t){PR.q=null;return}const q=GEN[t]();q.type=t;PR.q=q;PR.tries=0;PR.counted=false;PR.rev=false;PR.fb="";
  PR.ans=q.input.kind==="idx"?q.input.labels.map(()=>0):q.input.kind==="num"?"":null}
function tally(ok){if(PR.counted)return;PR.counted=true;const t=PR.q.type;PST[t]=PST[t]||[0,0];PST[t][1]++;if(ok)PST[t][0]++;savePST();PR.log.push({t,ok})}
function ansDisplay(){const q=PR.q,a=PR.ans,I=q.input;if(I.hex==="plane")return idx([a[0],a[1],-(a[0]+a[1]),a[2]],"()");if(I.hex==="dir")return idx([a[0],a[1],-(a[0]+a[1]),a[2]],"[]");
  return I.br.trim()?idx(a,I.br):ib(a[0])}
function pAnswerUI(){const q=PR.q,I=q.input;
  if(I.kind==="idx")return`<div class="bigidx" id="pdisp">${ansDisplay()}</div><div class="stps">${I.labels.map((l,j)=>(I.hex&&j===2?`<div class="stp"><span class="sl">${I.hex==="dir"?"t":"i"}</span><output class="sv auto" id="pauto">${ib(-(PR.ans[0]+PR.ans[1]))}</output></div>`:"")+
    `<div class="stp"><span class="sl">${l}</span><button class="sb" data-pst="${j}" data-d="-1" aria-label="${l} 減一">−</button><output class="sv">${ib(PR.ans[j])}</output><button class="sb" data-pst="${j}" data-d="1" aria-label="${l} 加一">＋</button></div>`).join("")}</div>`;
  if(I.kind==="num")return`<label class="numrow"><input class="tin" id="pnum" data-pin="1" inputmode="decimal" autocomplete="off" placeholder="${I.ph||""}" value="${PR.ans}"> <span>${I.unit||""}</span></label>`;
  return`<div class="mcq">${I.opts.map((o,j)=>{let c="";if(PR.rev&&j===q.ai)c=" right";else if(PR.ans===j&&PR.tries&&!(PR.rev&&j===q.ai))c=PR.lastOk?" right":" wrong";
    return`<label class="opt${c}"><input type="radio" name="pmc" data-pmc="${j}"${PR.ans===j?" checked":""}> ${o}</label>`}).join("")}</div>`}
function panelPractice(){const chips=PCATS.map(([k,n])=>`<button class="pchip" data-pcat="${k}" aria-pressed="${PR.cats[k]}">${n}</button>`).join("");
  const tot=Object.values(PST).reduce((s,v)=>[s[0]+v[0],s[1]+v[1]],[0,0]);
  let h=`<div><p class="ph">題型（可複選，改了會重新開始一回）</p><div class="chips">${chips}</div></div>`;
  if(!PR.q){const by={};PR.log.forEach(r=>{const c=PCATS.find(c=>c[2].includes(r.t))[1];by[c]=by[c]||[0,0];by[c][1]++;if(r.ok)by[c][0]++});const ok=PR.log.filter(r=>r.ok).length;
    h+=`<div class="quiz"><b>本回結束：答對 ${ok} / ${PR.log.length} 題</b><div class="tbl"><table class="cmp" style="min-width:0"><thead><tr><th>題型</th><th>答對</th></tr></thead><tbody>${Object.entries(by).map(([c,v])=>`<tr><td>${c}</td><td>${v[0]} / ${v[1]}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">${ok===PR.log.length?"全部答對，很穩！可以換別的題型組合挑戰。":"答錯的題型可以回到上面的分頁，用 3D 教具自己調整數字多看幾次。"}</p><div class="qacts"><button class="b" data-pr="restart">再練一回</button></div></div>`;
    return h+`<span class="score">累計（這台裝置）：答對 ${tot[0]} / ${tot[1]} 題</span>`}
  const q=PR.q,done=PR.log.filter(r=>r.ok).length;
  h+=`<div class="pbar"><span>第 ${PR.i+1} / ${ROUND} 題</span><span>本回答對 ${done}</span></div><div class="pprog"><i style="width:${PR.i/ROUND*100}%"></i></div>
   <div class="quiz"><span class="qtag">${q.title}</span><div>${q.prompt}</div>${pAnswerUI()}
   <div class="qacts">${PR.rev?"":`<button class="b" data-pr="check">檢查</button><button class="b ghost" data-pr="show">看詳解</button>`}<button class="b${PR.rev?"":" ghost"}" data-pr="next">${PR.i+1<ROUND?"下一題":"看本回結果"}</button></div>
   <div>${PR.fb}</div>${PR.rev?`<div class="steps"><b>詳解</b>${q.sol()}<a class="toolink" href="#" data-pr="go">在 3D 教具裡自己調整這一題 →</a></div>`:""}</div>
   <span class="score">累計（這台裝置）：答對 ${tot[0]} / ${tot[1]} 題</span>`;
  return h}
function pCheck(){const q=PR.q,I=q.input;let a=PR.ans;
  if(I.kind==="num"){a=parseNum(PR.ans);if(isNaN(a)){PR.fb=`<div class="fb no">請輸入數字，例如 0.2338 或 1/2。</div>`;renderPanel();return}}
  if(I.kind==="mc"&&a==null){PR.fb=`<div class="fb no">請先選一個答案。</div>`;renderPanel();return}
  const r=q.check(a);PR.tries++;PR.lastOk=r.ok;tally(r.ok);if(r.ok&&!q.gAw&&window.GAME&&GAME.state().sid){q.gAw=1;GAME.miller(true,PR.tries===1)}else if(!r.ok&&!q.gW&&!q.gAw&&window.GAME&&GAME.state().sid){q.gW=1;GAME.wrong({id:"m-"+q.type+"-"+Date.now()})}
  if(r.ok){PR.rev=true;PR.fb=`<div class="fb ok"><b>答對了！</b>${PR.tries>1?"（第 "+PR.tries+" 次答對，本回只算第一次的結果）":""}${r.note||""}</div>`;rebuild()}
  else PR.fb=`<div class="fb no"><b>再想想。</b>${r.note||q.hint}${PR.tries>=2?"　也可以按「看詳解」。":""}</div>`;
  renderPanel()}
function buildPractice(){if(!PR.q){drawCells(1,false);drawAxes(1.4);return}PR.q.scene(PR.rev)}
$("panel").addEventListener("click",e=>{if(S.tab!=="practice")return;const b=e.target.closest("[data-pst],[data-pr],[data-pcat]");if(!b)return;
  if(b.dataset.pst!=null){const j=+b.dataset.pst;PR.ans[j]=clamp(PR.ans[j]+(+b.dataset.d),-6,6);renderPanel();return}
  if(b.dataset.pcat){const k=b.dataset.pcat;PR.cats[k]=!PR.cats[k];if(!Object.values(PR.cats).some(Boolean))PR.cats[k]=true;newRound();renderPanel();resetView(false);rebuild();return}
  const a=b.dataset.pr;if(a==="check")pCheck();
  if(a==="show"){tally(false);PR.rev=true;PR.fb=`<div class="fb ok"><b>答案已顯示。</b>3D 圖也加上了解題線索，轉一轉對照看看。</div>`;renderPanel();rebuild()}
  if(a==="next"){if(!PR.counted)tally(false);PR.i++;loadQ();renderPanel();resetView(false);rebuild();$("stage").scrollIntoView({block:"start",behavior:reduceMotion?"auto":"smooth"})}
  if(a==="restart"){newRound();renderPanel();resetView(false);rebuild()}
  if(a==="go"){e.preventDefault();PR.q.go();window.scrollTo({top:0,behavior:reduceMotion?"auto":"smooth"})}});
$("panel").addEventListener("change",e=>{if(S.tab!=="practice")return;const t=e.target;if(t.dataset.pmc!=null){PR.ans=+t.dataset.pmc;if(!PR.rev){PR.tries=PR.tries;}}});
$("panel").addEventListener("input",e=>{if(S.tab!=="practice")return;const t=e.target;if(t.dataset.pin)PR.ans=t.value});
$("panel").addEventListener("keydown",e=>{if(S.tab==="practice"&&e.target.dataset&&e.target.dataset.pin&&e.key==="Enter"){e.preventDefault();pCheck()}});
newRound();
if(window.GAME)GAME.init({mount:document.querySelector("header.top")});


/* ================= tabs ================= */
function setTab(t){S.tab=t;try{history.replaceState(null,"","#"+t)}catch(e){}
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  const proof=t==="proof";$("stage").hidden=proof;$("proof").hidden=!proof;stopAuto();
  if(proof){if(!$("proof").innerHTML)$("proof").innerHTML=proofHTML();updProof();return}
  renderPanel();syncVtools();if(renderer){resize();resetView(false);rebuild()}}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.tab!=="proof")rebuild()});

init3D();
{const h=(location.hash||"").slice(1);setTab(["plane","dir","hex","practice","proof"].includes(h)?h:"plane")}
</script>
